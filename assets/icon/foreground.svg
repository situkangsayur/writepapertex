<?xml version="1.0" encoding="UTF-8"?>
<!-- Selembar kertas dengan huruf X berkait di tengahnya.
     Kertas untuk naskahnya, X untuk TeX. Dua bentuk saja, supaya masih
     terbaca pada 48 piksel — yang sebelumnya terlalu ramai. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <g transform="translate(54 54)">
    <!-- Lembar kertas, dengan sudut kanan atas terlipat. -->
    <path d="M -19 -25 L 8 -25 L 19 -14 L 19 25 L -19 25 Z"
          fill="#ffffff"/>
    <path d="M 8 -25 L 8 -14 L 19 -14 Z" fill="#cfd8e3"/>

    <!-- X berkait, bentuk serif yang membuatnya terbaca sebagai TeX
         dan bukan sekadar tanda silang. -->
    <g fill="#ee7b1d">
      <path d="M -10 -8 L -3.4 -8 L 0 -1.6 L 3.4 -8 L 10 -8 L 3.6 3 L 10.4 14 L 3.6 14
               L 0 7.6 L -3.6 14 L -10.4 14 L -3.6 3 Z"/>
      <rect x="-12" y="-9.6" width="5.2" height="1.8" rx="0.8"/>
      <rect x="6.8" y="-9.6" width="5.2" height="1.8" rx="0.8"/>
      <rect x="-12.6" y="14" width="5.6" height="1.8" rx="0.8"/>
      <rect x="7" y="14" width="5.6" height="1.8" rx="0.8"/>
    </g>
  </g>
</svg>
