[package]
name = "wptex_engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# cdylib supaya Android bisa memuatnya, dan Dart memanggilnya lewat dart:ffi.
crate-type = ["cdylib"]

[dependencies]
# Menunjuk ke pohon Tectonic yang sudah ditambal oleh
# scripts/build-tectonic-android.sh. Crate ini disalin ke dalam pohon itu
# saat dibangun, jadi jalurnya selalu induknya.
tectonic = { path = "..", default-features = false, features = [
  # harfbuzz diambil dari vcpkg; submodule-nya tidak ikut pada clone --depth 1.
  "external-harfbuzz",
  # Dibutuhkan latex_to_pdf untuk mengambil paket TeX sesuai kebutuhan.
  "geturl-reqwest",
  "native-tls-vendored",
  "serialization",
] }

# libgit2 untuk Android. Protokol git-nya tidak ditulis ulang: yang sudah ada
# dan teruji dipakai, dan pustakanya di-vendor supaya tidak bergantung pada
# apa pun yang terpasang di perangkat.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl", "https"] }

# Berdiri sendiri, bukan anggota workspace Tectonic.
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Sengaja BUKAN "abort". Panic di dalam Tectonic harus bisa ditangkap dan
# diubah menjadi pesan, bukan mematikan seluruh aplikasi — yang persis terjadi
# pada percobaan pertama di perangkat: SIGABRT di dalam wptex_compile.
panic = "unwind"
